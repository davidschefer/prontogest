<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../Css/base.css" />
  <link rel="stylesheet" href="../Css/super-admin.css" />
  <link rel="stylesheet" href="../Css/leads.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <title>Leads - ProntoGest</title>
</head>
<body>
  <aside class="sidebar">
    <div class="icon">
      <img src="../img/logo.png" class="logo-sidebar" />
    </div>
    <a href="./dashboard.html">Dashboard</a>
    <a href="./super-admin.html" class="superadmin-only">Cadastro de Cliente</a>
    <a href="./cadastro-trial.html" class="superadmin-only">Cadastro Trial</a>
    <a href="./leads.html" class="is-active superadmin-only">Leads</a>
    <a href="./controle-financeiro.html" class="superadmin-only">Controle Financeiro</a>
    <button class="btn-sair" onclick="logout()">Sair</button>
  </aside>

  <div class="content">
    <h1>Leads</h1>

    <section class="card finance-summary-card">
      <div class="finance-summary-grid leads-summary-grid">
        <div class="summary-stat">
          <span>Total de leads</span>
          <strong id="totalLeads">0</strong>
        </div>
        <div class="summary-stat">
          <span>Novos</span>
          <strong id="totalNovo">0</strong>
        </div>
        <div class="summary-stat">
          <span>Em contato</span>
          <strong id="totalEmContato">0</strong>
        </div>
        <div class="summary-stat">
          <span>Convertidos</span>
          <strong id="totalConvertido">0</strong>
        </div>
      </div>
    </section>

    <section class="card super-card finance-panel">
      <div class="finance-toolbar leads-toolbar">
        <div class="toolbar-field">
          <label for="filtroStatusLead">Status</label>
          <select id="filtroStatusLead">
            <option value="todos">Todos</option>
            <option value="novo">Novo</option>
            <option value="em_contato">Em contato</option>
            <option value="convertido">Convertido</option>
            <option value="descartado">Descartado</option>
          </select>
        </div>

        <div class="toolbar-field toolbar-field-search">
          <label for="buscaLead">Buscar por nome ou instituição</label>
          <input id="buscaLead" type="text" placeholder="Ex: Maria, Casa Vida..." />
        </div>

        <button id="btnAtualizarLeads" class="btn btn-primary" type="button">Atualizar</button>
      </div>

      <div id="leadsLista" class="leads-lista"></div>
    </section>
  </div>

  <script src="../Js/api.js"></script>
  <script src="../Js/logout.js"></script>
  <script src="../Js/auth-guard.js"></script>
  <script src="../Js/menu-guard.js"></script>
  <script src="../Js/leads.js"></script>
</body>
</html>
